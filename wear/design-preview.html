<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frog Watch Tile — Design Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202126; color: #fff; }
    .preview { display: grid; justify-items: center; gap: 22px; padding: 24px; }
    .watch {
      width: 408px; height: 408px; border-radius: 50%; overflow: hidden;
      background: #000; box-shadow: 0 0 0 9px #45474d, 0 20px 55px #0009;
      padding: 32px 54px 0;
    }
    .title { margin: 0 0 25px; text-align: center; font-size: 27px; line-height: 36px; font-weight: 600; letter-spacing: -.5px; }
    .open-phone {
      flex: none; width: 48px; height: 56px;
      display: grid; place-items: center;
      padding: 0; border: 0; background: none;
      color: #d7d9de; cursor: pointer; border-radius: 50%;
    }
    .open-phone:hover { color: #fff; }
    .open-phone:active { transform: scale(.9); }
    .open-phone:focus-visible { outline: 2px solid #aeb8ff; }
    .open-phone.sent { background: #fff; color: #14151a; }
    .open-phone svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .controls { display: grid; gap: 27px; }
    .control { height: 58px; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .copy { text-align: right; }
    .name { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -.6px; }
    .phone-copy { margin-left: 16px; }
    .phone-name { font-weight: 600; }
    .action {
      flex: none; display: grid; place-items: center; width: 56px; height: 56px;
      border: 2px solid #fff; border-radius: 50%; background: #fff; color: #14151a;
      cursor: pointer; transition: transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease;
    }
    .action[aria-pressed="false"] { background: transparent; border-color: transparent; color: #fff; }
    .action[aria-pressed="true"]:hover { background: #e7e8eb; }
    .action[aria-pressed="false"]:hover { background: transparent; color: #c9cbd1; }
    .action:active { transform: scale(.88); }
    .action:focus-visible { outline: 3px solid #aeb8ff; outline-offset: 3px; }
    .action svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .caption { margin: 0; color: #c4c7cf; font-size: 14px; text-align: center; }
    @media (max-width: 460px) { .watch { transform: scale(.84); margin: -32px; } }
  </style>
</head>
<body>
  <main class="preview">
    <section class="watch" aria-label="Frog watch tile preview">
      <h1 class="title">Frog</h1>
      <div class="controls">
        <div class="control">
          <div class="copy"><div class="name">Lights</div></div>
          <button class="action" id="lights" aria-label="Turn all lights off" aria-pressed="true" title="Toggle all lights">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v13M8 8a12 12 0 1 0 16 0" /></svg>
          </button>
        </div>
        <div class="control">
          <div class="copy"><div class="name">TV</div></div>
          <button class="action" id="tv" aria-label="Turn TV off" aria-pressed="true" title="Toggle TV power">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v13M8 8a12 12 0 1 0 16 0" /></svg>
          </button>
          <div class="copy phone-copy"><div class="name phone-name">Phone</div></div>
          <button class="open-phone" id="open-phone" aria-label="Open Frog on phone" title="Open Frog on phone">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="2" width="18" height="28" rx="3"/><path d="M11 16h9m-4-4 4 4-4 4"/></svg>
          </button>
        </div>
        <div class="control">
          <div class="copy"><div class="name">TV audio</div></div>
          <button class="action" id="audio" aria-label="Audio on headphones; switch output" title="Switch TV audio output">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 18v-3a11 11 0 0 1 22 0v3M5 18v7a3 3 0 0 0 3 3h4v-11H8a3 3 0 0 0-3 3Zm22 0v7a3 3 0 0 1-3 3h-4v-11h4a3 3 0 0 1 3 3Z" /></svg>
          </button>
        </div>
      </div>
    </section>
    <p class="caption">Interactive layout preview — tap a button to see its immediate state change.</p>
  </main>
  <script>
    const states = { lights: true, tv: true, audio: 'headphones' }
    const speakerIcon = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12h6l8-6v20l-8-6H5zM23 11a7 7 0 0 1 0 10M26 7a13 13 0 0 1 0 18" /></svg>'
    const headphonesIcon = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 18v-3a11 11 0 0 1 22 0v3M5 18v7a3 3 0 0 0 3 3h4v-11H8a3 3 0 0 0-3 3Zm22 0v7a3 3 0 0 1-3 3h-4v-11h4a3 3 0 0 1 3 3Z" /></svg>'
    const phoneIcon = document.querySelector('#open-phone').innerHTML
    document.querySelector('#open-phone').addEventListener('click', () => {
      const button = document.querySelector('#open-phone')
      button.classList.add('sent')
      button.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="m7 16 6 6L25 9" /></svg>'
      setTimeout(() => { button.classList.remove('sent'); button.innerHTML = phoneIcon }, 1200)
    })
    document.querySelector('#lights').addEventListener('click', () => {
      states.lights = !states.lights
      document.querySelector('#lights').setAttribute('aria-pressed', String(states.lights))
      document.querySelector('#lights').setAttribute('aria-label', states.lights ? 'Turn all lights off' : 'Turn all lights on')
    })
    document.querySelector('#tv').addEventListener('click', () => {
      states.tv = !states.tv
      document.querySelector('#tv').setAttribute('aria-pressed', String(states.tv))
      document.querySelector('#tv').setAttribute('aria-label', states.tv ? 'Turn TV off' : 'Turn TV on')
    })
    document.querySelector('#audio').addEventListener('click', () => {
      states.audio = states.audio === 'headphones' ? 'speaker' : 'headphones'
      document.querySelector('#audio').innerHTML = states.audio === 'speaker' ? speakerIcon : headphonesIcon
      document.querySelector('#audio').setAttribute('aria-label', `Audio on ${states.audio}; switch output`)
    })
    if (new URLSearchParams(location.search).has('off')) {
      document.querySelector('#lights').click()
      document.querySelector('#tv').click()
    }
  </script>
</body>
</html>
