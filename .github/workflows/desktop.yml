name: Desktop builds

on:
  push:
    branches: [main, release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend and Python dependencies
        run: |
          npm ci
          python -m pip install pyinstaller -e tv/vendor/bscpylgtv

      - name: Build bundled Python library bridge
        run: npm run sidecar

      - name: Check frontend
        run: |
          npm run lint
          npm run build

      - name: Build Tauri installers
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: frog-${{ matrix.name }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
