[package]
name = "frog"
version = "0.1.0"
description = "Desktop controller for personal devices"
authors = ["wgmlgz"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "frog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
toml = "0.8"
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri-plugin-clipboard-manager = "2"
